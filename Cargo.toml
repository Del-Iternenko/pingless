[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.1.4"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Del-Iternenko/openlag"

[workspace.dependencies]
openlag-proto = { path = "crates/openlag-proto" }
openlag-core = { path = "crates/openlag-core" }
openlag-capture = { path = "crates/openlag-capture" }
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
clap = { version = "4", features = ["derive", "env"] }
chacha20poly1305 = "0.10"
blake3 = "1"
rand = "0.9"
parking_lot = "0.12"
socket2 = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
