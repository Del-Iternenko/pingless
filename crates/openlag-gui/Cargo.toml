[package]
description = "OpenLag desktop app"
name = "openlag-gui"
default-run = "openlag-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
openlag-capture.workspace = true
openlag-core.workspace = true
openlag-proxy = { path = "../openlag-proxy" }
parking_lot.workspace = true
rand.workspace = true
serde.workspace = true
serde_json = "1.0.154"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tokio.workspace = true
toml.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "gzip", "http2", "stream", "json"] }
sha2 = "0.10"
futures-util = "0.3"
portable-pty = "0.9"
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2"] }
base64 = "0.22"
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
tauri-build = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_ToolHelp", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_IO", "Win32_Security_Cryptography"] }
