[package]
description = "OpenLag desktop app"
name = "openlag-gui"
default-run = "openlag-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
openlag-capture.workspace = true
openlag-core.workspace = true
openlag-proxy = { version = "0.1.0", path = "../openlag-proxy" }
parking_lot.workspace = true
rand.workspace = true
serde.workspace = true
serde_json = "1.0.154"
tauri = "2"
tauri-plugin-dialog = "2"
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
tauri-build = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_ToolHelp"] }
